name: nour_ramadan
description: تطبيق نور رمضان - روح الشهر الكريم
publish_to: 'none'

version: 5.0.0+13

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ─── Firebase ───────────────────────────────────
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1
  firebase_remote_config: ^6.1.4
  firebase_crashlytics: ^5.0.7

  # ─── الصوت ─────────────────────────────────────
  just_audio: ^0.10.5
  audio_session: ^0.2.2

  # ─── أوقات الصلاة والمنبهات ────────────────────
  adhan: ^2.0.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1

  # ✅ Background Sync للرسائل (يُهيّئ في main.dart، callback معطَّل —
  # AzanWorker في Kotlin هو المسؤول الفعلي. راجع plan_azan_reliability.md،
  # المرحلة 6 — أُبقي عليه لأن main.dart لا يزال يستدعي Workmanager().initialize())
  workmanager: ^0.7.0

  # ─── القبلة ────────────────────────────────────
  flutter_qiblah: ^3.1.0+1

  # ─── الموقع الجغرافي ───────────────────────────
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # ─── State Management ──────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ─── التخزين المحلي ────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # ─── مراقبة الإنترنت ───────────────────────────
  connectivity_plus: ^7.0.0

  # ─── الأنيميشن ─────────────────────────────────
  flutter_animate: ^4.5.2

  # ─── التنقل ────────────────────────────────────
  go_router: ^17.0.0

  # ─── الاهتزاز (السبحة) ─────────────────────────
  vibration: ^3.1.7

  # ─── التاريخ الهجري ────────────────────────────
  hijri: ^3.0.0

  # ─── أدوات متنوعة ──────────────────────────────
  intl: ^0.20.2
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

  # ─── الاستجابة للشاشات ──────────────────────────
  flutter_screenutil: ^5.9.3
  dio: ^5.9.1
  http: ^1.6.0

  # ─── تتبع ظهور العناصر ──────────────────────────
  visibility_detector: ^0.4.0+2
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  # ✅ لون الخلفية مطابق للوجو (Navy Blue الداكن)
  color: "#0A1628"

  # ✅ مسار اللوجو
  image: assets/logo/logo.jpeg

  # ✅ موضع اللوجو
  android_gravity: center
  ios_content_mode: center

  # ✅ دعم الـ Dark Mode
  color_dark: "#0A1628"
  image_dark: assets/logo/logo.jpeg

  # ✅ Web (بدون image_mode)
  web:
    image: assets/logo/logo.jpeg
    color: "#0A1628"


flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/fonts/
    - assets/logo/
    - assets/quran/
    - assets/azkar/
    - assets/ahadeth/
    - assets/images/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
          weight: 700